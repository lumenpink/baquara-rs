name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: "Rust — Tests & Checks"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Cargo Clippy"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Cargo Test"
        run: cargo test --verbose

  deploy-banca:
    name: "Build & Publish Baquara Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "0.1.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION"

      - name: "Configure Sovereign Lumen Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"

      - name: "Compile Baquara Multiarch CLI Binaries"
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          cargo zigbuild --release --target x86_64-unknown-linux-musl --bin baquara || \
            cargo build --release --target x86_64-unknown-linux-musl --bin baquara

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          cargo zigbuild --release --target aarch64-unknown-linux-musl --bin baquara || \
            cargo build --release --target aarch64-unknown-linux-musl --bin baquara

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          cargo zigbuild --release --target x86_64-pc-windows-gnu --bin baquara || \
            cargo build --release --target x86_64-pc-windows-gnu --bin baquara

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          # 1. Empacotar Linux AMD64
          if [ -d target/x86_64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/baquara-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release baquara \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/baquara-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release baquara
          fi

          # 2. Empacotar Linux ARM64
          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/baquara-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release baquara \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/baquara-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release baquara
          fi

          # 3. Empacotar Windows AMD64
          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/baquara-${VERSION}-windows-amd64.zip" \
              baquara.exe "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/baquara-${VERSION}-windows-amd64.zip" \
              baquara.exe
            cd "$GITHUB_WORKSPACE"
          fi

          cd dist/packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          upload_r2_with_retry() {
            local target="$1"
            local file="$2"
            local max_attempts=4
            local attempt=1
            local delay=5

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "  -> Enviando $file para $target (tentativa $attempt/$max_attempts)..."
              if npx wrangler r2 object put "$target" --file="$file" --remote; then
                echo "  ✓ Upload concluído com sucesso: $target"
                return 0
              fi
              echo "  ⚠️ Falha transitória ao enviar para o R2 (tentativa $attempt/$max_attempts). Aguardando ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done

            echo "❌ ERRO CRÍTICO: Falha permanente após $max_attempts tentativas ao publicar no Cloudflare R2: $target"
            exit 1
          }

          echo "★ Publicando artefatos versionados no R2 (twolp-bucket)..."
          for pkg in dist/packages/*; do
            [ -f "$pkg" ] || continue
            filename=$(basename "$pkg")
            upload_r2_with_retry "twolp-bucket/downloads/baquara/${CHANNEL}/${filename}" "$pkg"
          done

          echo "★ Publicando binários unificados em latest..."
          if [ -f target/x86_64-unknown-linux-musl/release/baquara ]; then
            upload_r2_with_retry "twolp-bucket/downloads/baquara/${CHANNEL}-latest/baquara" target/x86_64-unknown-linux-musl/release/baquara
            upload_r2_with_retry "twolp-bucket/downloads/baquara/${CHANNEL}-latest/baquara-linux-amd64" target/x86_64-unknown-linux-musl/release/baquara
          fi
          if [ -f target/aarch64-unknown-linux-musl/release/baquara ]; then
            upload_r2_with_retry "twolp-bucket/downloads/baquara/${CHANNEL}-latest/baquara-linux-arm64" target/aarch64-unknown-linux-musl/release/baquara
          fi
          if [ -f target/x86_64-pc-windows-gnu/release/baquara.exe ]; then
            upload_r2_with_retry "twolp-bucket/downloads/baquara/${CHANNEL}-latest/baquara.exe" target/x86_64-pc-windows-gnu/release/baquara.exe
          fi

      - name: "Rotate Manifest & Commit to Banca"
        env:
          GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          echo "★ Clonando repositório soberano da Banca para rotação e retenção..."
          git clone --depth 1 "https://lumen:${GIT_2LP_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/baquara" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            # Registrar cada uma das arquiteturas
            for ARCH in "linux-amd64" "linux-arm64" "windows-amd64"; do
              EXT="tar.gz"
              [ "$ARCH" = "windows-amd64" ] && EXT="zip"
              PKG_FILE="baquara-${VERSION}-${ARCH}.${EXT}"

              HASH=$(grep "$PKG_FILE" "$GITHUB_WORKSPACE/dist/packages/SHA256SUMS" | awk '{print $1}' || echo "")
              DOWNLOAD_URL="https://bucket.2lp.in/downloads/baquara/${CHANNEL}/${PKG_FILE}"

              python3 scripts/rotate-downloads.py \
                --manifest site/downloads/baquara/index.json \
                --channel "${CHANNEL}" \
                --arch "${ARCH}" \
                --version-str "${VERSION}" \
                --url "${DOWNLOAD_URL}" \
                --sha256 "${HASH}" \
                --tarball "${PKG_FILE}" \
                --app "baquara"
            done

            # Commitar manifesto atualizado na Banca
            git config user.name "Baquara Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/baquara/index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate baquara release to ${VERSION} (#2)"
              git push origin main || echo "Aviso: Push do manifesto na Banca falhou."
            else
              echo "Manifesto já estava atualizado."
            fi
            cd "$GITHUB_WORKSPACE"
          fi
