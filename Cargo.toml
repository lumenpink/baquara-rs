[package]
name = "baquara"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Motor de IA local, RAG semântico e servidor MCP para o ecossistema Baquara"

[[bin]]
name = "baquara"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
dirs = "5.0"
regex = "1.10"
